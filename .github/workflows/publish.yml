name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: write   # create/update GitHub Release
  id-token: write   # OIDC trusted publishing

jobs:
  build:
    name: Build Distribution
    if: startsWith(github.ref, 'refs/tags/v')   # only run on a v* tag, never a branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag matches package version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(grep -Po '__version__\s*=\s*"\K[^"]+' src/younit/_version.py)
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install runtime dependencies
        run: uv sync

      - name: Build wheel and sdist
        run: uv build

      - name: Generate SBOM (runtime environment)
        run: |
          uvx --from "cyclonedx-bom>=4.4" cyclonedx-py environment \
            --output-format json \
            --output-file sbom-${{ steps.version.outputs.version }}.json \
            .venv/bin/python

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: |
            dist/
            sbom-*.json

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/younit-sdk/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz

      - name: Extract changelog excerpt
        run: |
          awk '/^## \[${{ needs.build.outputs.version }}\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore*
            sbom-*.json