name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      # Critical only: syntax errors, undefined names, broken comparisons, security (bandit).
      - name: ruff check (critical, blocking)
        run: uv run ruff check src/ tests/ --select E9,F63,F7,F82,S

      - name: ruff check (all rules, warning only)
        run: uv run ruff check src/ tests/
        continue-on-error: true

      - name: ruff format check (warning only)
        run: uv run ruff format --check src/ tests/
        continue-on-error: true

      - name: mypy (warning only)
        run: uv run mypy src/
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Overrides the 3.11 pin in .python-version so each matrix leg really uses its version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ \
            --cov=src/younit \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify distributions
        run: |
          ls -la dist/
          uv run python -c "import zipfile; zf = zipfile.ZipFile('$(ls dist/*.whl | head -1)'); print('Wheel contents:'); [print(' ', f) for f in zf.namelist()]"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
